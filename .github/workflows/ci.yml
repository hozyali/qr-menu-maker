# Required checks for every pull request (rulebook Laws 7, 12, and 25).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Read-only by default. A job asks for more only if it needs it.
permissions:
  contents: read

jobs:
  changelog:
    name: Changelog check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a CHANGELOG.md change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error::This PR must update CHANGELOG.md (Law 7)."
            exit 1
          fi

  migrations:
    name: Migration safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block destructive SQL unless the owner approved it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'migration-approved') }}
        run: |
          found=0
          while IFS= read -r file; do
            case "$file" in
              *migrations/*.sql)
                if [ -f "$file" ] && grep -nEi '\b(DROP|DELETE|TRUNCATE)\b|\bALTER\b.*\b(RENAME|DROP)\b' "$file"; then
                  echo "Destructive SQL found in $file"
                  found=1
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [ "$found" = 1 ] && [ "$APPROVED" != "true" ]; then
            echo "::error::Destructive SQL needs the owner's approval and the migration-approved label (Law 25)."
            exit 1
          fi
          echo "Migration check finished."

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app does not exist yet, so this passes until package.json is added.
      # After that, `npm run check` must run type check, lint, and all tests,
      # including the multi-tenant isolation tests.
      - name: Check for an app
        id: app
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package.json yet. Nothing to test."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Run type check, lint, and tests
        if: steps.app.outputs.exists == 'true'
        run: |
          npm ci --ignore-scripts
          npm run check
